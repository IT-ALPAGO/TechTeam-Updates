# Netlify deployment.
#
# The React app is a static build; /api/* is served by a serverless function
# so the Jira token stays on the server side and never reaches the browser.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Belt and braces: the function also declares `config.path`, but an explicit
# redirect keeps older Netlify builds routing correctly.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — must come after the API rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
